name: Update OpenAPI snapshot

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-openapi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "linten[proxy]"
      - name: Write minimal proxy config
        run: |
          cat > /tmp/config.yaml <<'EOF'
          model_list:
            - model_name: gpt-4o-mini
              linten_params:
                model: openai/gpt-4o-mini
                api_key: fake
          EOF
      - name: Start proxy and snapshot the spec
        run: |
          LINTEN_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY=true linten --config /tmp/config.yaml --port 4000 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:4000/openapi.json -o /dev/null; then
              break
            fi
            sleep 1
          done
          bash scripts/update-openapi.sh http://localhost:4000
      - name: Resolve installed linten version
        id: version
        run: echo "linten_version=$(python -c "from importlib.metadata import version; print(version('linten'))")" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v7
        id: pr
        with:
          branch: linten_openapi_snapshot
          commit-message: "docs: refresh the OpenAPI snapshot to linten ${{ steps.version.outputs.linten_version }}"
          title: "docs: refresh the OpenAPI snapshot to linten ${{ steps.version.outputs.linten_version }}"
          body: "Regenerated the OpenAPI snapshot behind https://docs.linten.ai/api-reference/ from linten ${{ steps.version.outputs.linten_version }} on PyPI."
      - name: Squash-merge once Vercel checks pass
        if: steps.pr.outputs.pull-request-operation == 'created'
        run: gh pr merge --squash --auto "${{ steps.pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ github.token }}
